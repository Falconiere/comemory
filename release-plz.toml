# release-plz configuration.
#
# release-plz runs as a Release-PR bot: on each push to `main` it opens/maintains
# a "release PR" that bumps the workspace version + rewrites CHANGELOG.md from the
# conventional commits since the last tag. Merging that PR makes release-plz push
# the `vX.Y.Z` annotated tag — which is the ONLY thing that fires the
# dist-generated `.github/workflows/release.yml`.
#
# Ownership split (see docs/claudness/specs/2026-06-17-automated-releases-release-plz-design.md):
#   release-plz -> next version + CHANGELOG + git tag
#   cargo-dist  -> build + GitHub Release + Homebrew + announce + sign (unchanged)

[workspace]
# comemory is never published to a cargo registry (publish = false below).
# By default release-plz derives the previous version from the registry; with
# the crate absent from crates.io that lookup returns "not found", release-plz
# treats it as already at its Cargo.toml version, and reports "already
# up-to-date" on every push — opening no release PR despite unreleased commits.
# git_only switches the baseline to git tags: release-plz reads the existing
# `vX.Y.Z` tags, diffs the commits since, computes the bump, and opens the PR.
# (Requires publish != true for the package, which holds here. Shipped in
# release-plz 0.3.156 via https://github.com/release-plz/release-plz/issues/1144.)
git_only = true
# Match the existing `vX.Y.Z` tag history (also what release.yml / cargo-dist
# consume). This equals release-plz's default template, pinned explicitly so
# git_only's tag scan keeps matching regardless of upstream default changes.
git_tag_name = "v{{ version }}"
# Push the vX.Y.Z git tag when the release PR merges. This tag triggers
# release.yml. Annotated by default (this repo rejects lightweight tags).
git_tag_enable = true
# cargo-dist's `host` job creates the GitHub Release (its body is then curated
# from CHANGELOG.md by release-finalize.yml). release-plz must NOT create one.
git_release_enable = false
# comemory is not published to crates.io (bundled rusqlite + load_extension).
publish = false

# Changelog generation (git-cliff under the hood). The commit_parsers below
# carry forward the buckets of the now-retired scripts/changelog-draft.sh so the
# bot-authored sections stay continuous with the hand-authored history — minus
# its `Internal` section, which no longer reaches the public changelog (see the
# skip rules and docs/release.md § "Cutting a release").
[changelog]
protect_breaking_commits = true

# A hidden "<!-- N -->" sort-index prefixes each group so the sections render in
# Keep-a-Changelog order; the body template strips it back off.
#
# Two classes of commit are dropped outright rather than bucketed. Both were
# measured on the release PRs they broke:
#
#  1. Review-loop bookkeeping ("address PR review feedback", "act on the five
#     findings from the last round"). The subject describes the code-review
#     process, not a change, so the entry tells a reader nothing. v0.18.0
#     shipped eight of them into `Fixed`.
#  2. Internal-only types (docs/chore/ci/test/build). These used to fill an
#     `Internal` section of the public changelog; release notes are for people
#     consuming the release, and `git log` remains the record for everything
#     else.
#
# This is not cosmetic. The AI reviewer flags both classes as non-user-facing
# changelog noise (PR #88 on class 1, PR #83 on class 2), and a finding on a
# release PR cannot be fixed by hand: release-plz regenerates the changelog
# from these same subjects on the next push to `main` and opens a REPLACEMENT
# PR (see the closed #77/#79 and #51/#53 duplicate pairs). The only durable
# place to fix it is here.
#
# `protect_breaking_commits = true` above outranks every `skip` below, so a
# breaking change is never dropped no matter which rule would match it.
commit_parsers = [
    { message = '^[a-z]+(\(.+\))?!:', group = "<!-- 0 -->BREAKING" },
    # Anchored to the start of a line and requiring the colon, because
    # `BREAKING CHANGE` is a conventional-commit FOOTER, not a phrase. The
    # unanchored `.*BREAKING CHANGE` this replaces matched any commit whose
    # body merely mentioned the words — `ci: parse the severity gate with awk`
    # discussed the footer in prose and was published under BREAKING in the
    # v0.18.2 draft.
    # Both separators the conventional-commits spec defines for a footer,
    # `: ` and ` #`, with the space before `#` optional so the `CHANGE#12`
    # spelling some tools emit is caught too. Matching only the colon would
    # miss `BREAKING CHANGE #12` entirely.
    { body = '(?m)^BREAKING[ -]CHANGE ?(:|#)', group = "<!-- 0 -->BREAKING" },
    # A `BREAKING CHANGE:` trailer is a conventional-commit *footer*, and
    # git-cliff parses footers separately from the body — so the rule above
    # does not see it. Without this rule a breaking `docs:`/`ci:` commit whose
    # only breaking marker is that footer would reach the type skip below,
    # where `protect_breaking_commits` correctly refuses to skip it but the
    # skip rule sets no group, leaving it grouped `None` and dropped by the
    # template's `group_by`. Catch it here, before any skip rule can see it.
    { footer = '^BREAKING[ -]CHANGE ?(:|#)', group = "<!-- 0 -->BREAKING" },
    # Class 1. The verb list is deliberately closed: it matches a subject whose
    # whole point is "responded to the review", and leaves a real change that
    # merely happens to mention one. `fix(review): state the EPIPE mechanism
    # exactly` and `test: tighten four more assertions from the round-4 review`
    # both survive it; `fix(ci): address PR review feedback` does not.
    { message = '(?i)^\w+(\(.+\))?!?: *(address|act on|clear|resolve|apply|finish)\b.*\b(review|reviewer|findings?)\b', skip = true },
    # Class 2.
    { message = '^(docs|chore|ci|test|build)(\(.+\))?:', skip = true },
    { message = '^feat', group = "<!-- 1 -->Added" },
    { message = '^refactor', group = "<!-- 2 -->Changed" },
    { message = '^perf', group = "<!-- 2 -->Changed" },
    { message = '^style', group = "<!-- 2 -->Changed" },
    { message = '^fix', group = "<!-- 3 -->Fixed" },
    { message = '^revert', group = "<!-- 4 -->Removed" },
    { message = '^sec(urity)?', group = "<!-- 5 -->Security" },
    # A subject that matched no rule above is not a conventional commit, so its
    # type is unknown and no section is right for it. Dropped rather than
    # guessed at; `git log` still has it, and the reviewer never sees a line
    # nobody can classify.
    { message = '.*', skip = true },
]

header = """
# Changelog

All notable changes to this project are documented in this file. The format is
based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
"""

# Tera template. `timestamp` is stamped when the release-pr job last runs, so the
# heading date is NOT guaranteed to be the merge day — scripts/validate-release.sh
# accepts any ISO date for this reason.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
