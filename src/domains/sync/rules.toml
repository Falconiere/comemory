# Curated secret-detection rules for sync push + session capture.
# Loaded at compile time via include_str! in redact.rs.
# Rule `name` values for format-anchored rules match the platform Slice 3
# catalogue (`aws-access-key-id`, …). `generic-high-entropy` is client-only.

[[rule]]
name = "aws-access-key-id"
pattern = '''AKIA[0-9A-Z]{16}'''

[[rule]]
name = "aws-secret-access-key"
pattern = '''(?i)(?:aws)?[_-]?secret[_-]?(?:access[_-]?)?key[\s]*[=:]\s*['"]?([A-Za-z0-9/+=]{40})'''

[[rule]]
name = "github-token"
pattern = '''ghp_[A-Za-z0-9]{20,}'''

[[rule]]
name = "gitlab-token"
pattern = '''glpat-[A-Za-z0-9\-_]{20,}'''

[[rule]]
name = "slack-token"
pattern = '''xox[baprs]-[A-Za-z0-9\-]{10,}'''

[[rule]]
name = "stripe-key"
pattern = '''sk_(live|test)_[A-Za-z0-9]{20,}'''

[[rule]]
name = "openai-key"
pattern = '''sk-[A-Za-z0-9]{20,}'''

[[rule]]
name = "anthropic-key"
pattern = '''sk-ant-[A-Za-z0-9\-_]{20,}'''

[[rule]]
name = "jwt"
pattern = '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''

[[rule]]
name = "private-key-pem"
pattern = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''

[[rule]]
name = "generic-high-entropy"
pattern = '''(?i)(?:key|token|secret|password|passwd|pwd|api[_-]?key|auth)[\s]*[=:]\s*['"]?([A-Za-z0-9+/=_\-]{20,})'''
