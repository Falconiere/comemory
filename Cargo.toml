[package]
name = "comemory"
version = "0.17.0"
edition = "2024"
description = "Agentic dev memory + code-aware semantic search via a two-layer property graph."
license = "MIT"
repository = "https://github.com/Falconiere/comemory"
homepage = "https://github.com/Falconiere/comemory"
rust-version = "1.95"

[[bin]]
name = "comemory"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[bench]]
name = "retrieval"
harness = false

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "graph"
harness = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# Delimited-text (CSV/TSV) document extraction (src/document/delimited.rs).
csv = "1"
futures = "0.3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# Git-style glob matching for `search --path` (src/retrieval/doc_route.rs).
# Already resolved transitively via `ignore`; promoted to a direct dep so
# the version is pinned explicitly rather than riding `ignore`'s choice.
globset = "0.4"
ignore = "0.4"
# Direct dep on the raw SQLite bindings for the FTS5 tokenizer FFI in
# src/store/tokenizer/ffi.rs. Already transitive via rusqlite's `bundled`
# feature; keep the version line in sync with the rusqlite lock (0.38.x).
libsqlite3-sys = "0.38"
once_cell = "1"
owo-colors = "4"
regex = "1"
# The `libsqlite3-sys` FEATURE selects rusqlite's native FFI backend (rusqlite
# 0.40 made that backend optional so a wasm one can be chosen instead), and
# `bundled` only applies through it. The `libsqlite3-sys` VERSION line above
# tracks the series rusqlite 0.40 pins (0.38).
rusqlite = { version = "0.40", features = ["libsqlite3-sys", "bundled", "load_extension", "vtab", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
siphasher = "1"
sqlite-vec = "0.1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
# Pure-Rust HTML/XHTML tag-stripping (src/document/html.rs); MIT, zero deps.
tl = "0.7"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# url 2.5.8 was published with a duplicate Debug impl on `Url` that fails to
# compile under recent rustc; pin transitive dep to last good release.
url = "=2.5.7"
unicode-normalization = "0.1"

[dependencies.ast-grep-core]
version = "0.45"

# ast-grep-language provides the per-language `Language` trait impls that
# pair with ast-grep-core. Default features are off because the crate's
# `builtin-parser` umbrella now links EVERY tree-sitter grammar (bash, c,
# dart, hcl, nix, solidity, ...); its `parsers.rs` gates each `language_*()`
# constructor on that grammar's own `tree-sitter-<lang>` feature and stubs
# the rest to `unimplemented!()`. Only the five grammars comemory supports
# are enabled, and `src/ast/languages.rs` is the gate that keeps every
# other `language_*()` from ever being called.
[dependencies.ast-grep-language]
version = "0.45"
default-features = false
features = [
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-go",
]

[build-dependencies]
cc = "1"

# House lints (toolu-conventions Rust stack). `scripts/lint-check.sh` runs
# `cargo clippy --all-targets --all-features -- -D warnings`, so every `warn`
# below is a hard CI failure.
#
# DEVIATION D1: `unsafe_code = "forbid"` is deliberately NOT set. The crate has
# 7 FFI-necessary `unsafe` blocks (FTS5 tokenizer registration in
# src/store/tokenizer/ffi.rs, sqlite-vec auto-extension registration in
# src/store/connection.rs). `forbid` is a hard rustc error with no local
# override, so it cannot be applied here. The SAFETY-comment discipline is
# enforced instead by
# scripts/guardrails/patterns/rust/no-unsafe-without-safety.yml.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# CORE rule 10 (Rust half): no unwrap()/expect() outside tests and bootstrap.
unwrap_used = "warn"
expect_used = "warn"
# The function-length ceiling. DECLARED in guardrails.config.json
# (functionSize.max = 100), thresholded in clippy.toml, denied here.
# Measured: zero violations in src/ today, so `deny` lands clean.
too_many_lines = "deny"
# comemory-specific: diagnostics go through `tracing`, never stdio; a stub is
# never committed. Measured: zero violations outside tests.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Practical relaxations of the two noisiest pedantic lints (kit template).
module_name_repetitions = "allow"
must_use_candidate = "allow"

# ---------------------------------------------------------------------------
# DEVIATION D7 — declared lint debt. Each line carries the measured count on
# `cargo clippy --lib` at migration time. Burn one down, delete its line, and
# the lint is live again. Do NOT add to this list without the same treatment.
# Tracking doc: docs/lint-debt.md
# ---------------------------------------------------------------------------
missing_errors_doc = "allow"        # 202 — needs a `# Errors` section per fallible fn
doc_markdown = "allow"              # 145 — un-backticked identifiers in doc comments
cast_possible_wrap = "allow"        #  37 — usize/u64 -> i64 at SQLite boundaries
unused_async = "allow"              #  25 — async CLI handlers kept uniform for dispatch
cast_precision_loss = "allow"       #  23 — deliberate in ranking math (u64/usize -> f64)
cast_sign_loss = "allow"            #  21 — SQLite returns i64 for non-negative counts
cast_possible_truncation = "allow"  #  18 — bounded by construction at each site
needless_pass_by_value = "allow"    #  16

# ---------------------------------------------------------------------------
# Phase 4b escape hatch (not part of the original D7 debt above): one
# genuinely-stuck singleton, added only after the direct fix proved to carry
# real blast radius.
# ---------------------------------------------------------------------------
struct_field_names = "allow"  # 1 — `eval::bandit::Arm::arm_id`; the field is
# a serialized `comemory bandit --json` output key plus a Rust field name
# read directly by ~10 assertions across tests/eval__bandit.rs and
# tests/eval__bandit_rng.rs. Renaming to drop the struct-name prefix is a
# CLI-output/test-file change, not a lint fix, so it stays out of scope here.

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.8", default-features = false, features = ["html_reports", "async_tokio"] }
insta = { version = "1", features = ["json", "yaml"] }
predicates = "3"
proptest = "1"
# Tests only ever talk to the loopback `comemory serve`; no TLS backend.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query"] }
tempfile = "3"
# Tests construct `OffsetDateTime` values to drive the query-id round-trip
# (`stats::feedback::generate_query_id`); same version line as the main dep.
time = { version = "0.3", features = ["macros"] }
# In-process `serve` router tests (tests/serve__*.rs) need an async runtime
# to drive `tower::ServiceExt::oneshot`; tokio is already a main dep with
# `full`, pinned explicitly here for the features the tests actually use.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `ServiceExt::oneshot` drives the axum router in-process (no socket bind),
# so `serve`'s coverage is recorded instead of lost to a SIGKILLed
# subprocess. Already transitive via axum.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 256

[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.release-quick]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"

# The profile that 'dist' will build with. Fat LTO so shipped artifacts match
# local `cargo build --release` quality (codegen-units=1, strip, panic=abort
# all inherited from [profile.release]).
[profile.dist]
inherits = "release"
lto = "fat"

# `url` is a transitive-version pin, not a direct import (see the comment
# above the `url` entry under [dependencies]); cargo-machete would otherwise
# report it unused.
[package.metadata.cargo-machete]
ignored = ["url"]

# Single-member workspace so cargo-dist can read its workspace-only fields
# (cargo-dist-version, ci, pr-run-mode, hosting). cargo-dist 0.22+ rejects
# these fields when they live under [package.metadata.dist].
[workspace]
members = ["."]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "Falconiere/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Custom job run after `announce`, i.e. after the release exists and every
# artifact is on it. This is how release-finalize gets invoked: an
# `on: release` trigger can never fire, because the release is created by the
# generated `host` job using GITHUB_TOKEN and GitHub does not dispatch
# workflows from events that token raises. Declared here rather than by editing
# release.yml, which dist regenerates.
post-announce-jobs = ["./release-finalize"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
publish-prereleases = false
allow-dirty = ["ci"]
