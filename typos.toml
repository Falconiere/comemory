[files]
# tests/golden/ is benchmark fixture data: content-derived 8-hex ids and slugs
# (file names + memory.yml id refs) spuriously trip the dictionary — data, not
# prose, so never spell-check it.
# scripts/guardrails/ is vendored verbatim from toolu-conventions upstream and
# must never be hand-edited (see "Claude Code Hooks" in CLAUDE.md; the hook that
# used to enforce this is retired, so it is convention now)
# — typos in it are upstream's to fix, not ours to silently rewrite.
# comemory.io/ is a SEPARATE git repo (CodaSignal/comemory.io, the platform
# monorepo) that gets cloned inside this checkout; it owns its own gates.
extend-exclude = ["tests/golden/", "scripts/guardrails/", "comemory.io/"]

[default]
extend-ignore-identifiers-re = ["nomic", "kuzu", "qwick", "cose", "ratatui"]  # ratatui: crate name kept in CHANGELOG history
extend-ignore-re = [
  "serde::ser::",
  "cose-bilkent",
  "cose-base",
  # `include-flate` / `include-flate-codegen` are real crate names; flagged
  # because `flate` looks like `flat` to the dictionary.
  "include-flate",
]
