[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # unsafe-libyaml is unmaintained (not a vulnerability). It reaches us only
  # through the direct dep serde_yaml 0.9, which is itself deprecated and has
  # no release that drops it, so there is no safe upgrade.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained unsafe-libyaml via serde_yaml 0.9; no safe upgrade" },
]

[licenses]
# Permissive FOSS licenses present in the transitive dep tree. Each is
# OSI-approved or otherwise broadly permissive.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  # BSL-1.0: Boost Software License, permissive (xxhash-rust)
  "BSL-1.0",
  # ISC: rustls-webpki / ring / aws-lc-rs (reqwest `rustls` stack, #138)
  "ISC",
  # MIT-0: aws-lc-sys (zero-clause MIT, permissive)
  "MIT-0",
  # CDLA-Permissive-2.0: aws-lc-sys data files (permissive)
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
