# Lefthook — fast local git gates. The full quality gate is `just check`
# (scripts/check-all.sh) and CI; hooks stay fast so commits don't stall.
#
# Install after editing:  lefthook install
#
# type-check and clippy deliberately do NOT run pre-commit: they compile the
# crate (bundled SQLite + vendored libgit2 + 5 tree-sitter parsers) and stall a
# commit for minutes. They run pre-push, inside check-all.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: bash scripts/fmt-check.sh
    guardrails:
      glob: "*"
      run: bash scripts/guardrails/run.sh --file {staged_files}
    typos:
      run: bash scripts/typos-check.sh

pre-push:
  commands:
    check_all:
      run: bash scripts/check-all.sh
