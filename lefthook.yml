# Lefthook — fast local git gates. The full quality gate is `just check`
# (scripts/check-all.sh) and CI; hooks stay fast so commits don't stall.
#
# Install after editing:  lefthook install
#
# Clippy (including type-checking) deliberately runs pre-push, inside check-all.
# Compiling bundled SQLite, vendored libgit2 and tree-sitter parsers can stall
# a commit for minutes.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: bash scripts/fmt-check.sh
    guardrails:
      glob: "*"
      # Use CI's scope: source ceilings do not apply to generated schema snapshots.
      # Both secret checks enumerate git-tracked files, excluding untracked secrets.
      run: bash scripts/guardrails/run.sh
    architecture:
      glob: "*.rs"
      run: bash scripts/architecture-check.sh --file {staged_files}
    typos:
      run: bash scripts/typos-check.sh

pre-push:
  commands:
    check_all:
      run: bash scripts/check-all.sh
