name: Await code review
description: >-
  Block until this commit's Code Review check has concluded, then fail
  unless it succeeded AND reported zero findings. Lets a workflow depend on
  another workflow's result, which GitHub Actions has no native `needs:`
  for.

inputs:
  sha:
    description: Commit whose check runs are polled. Defaults to this run's SHA.
    required: false
    default: ""
  timeout-minutes:
    description: >-
      How long to wait for the review to conclude. Must exceed the review
      workflow's own `timeout-minutes`, or this gate reports a timeout for a
      review that was about to finish.
    required: false
    default: "20"
  check-name:
    description: Name of the check run to wait on.
    required: false
    default: review
  github-token:
    description: >-
      Token used to read the check run and the reviewer's comment. Needs the
      `checks: read` and `pull-requests: read` permissions.
    required: true

runs:
  using: composite
  steps:
    - name: Wait for the code review to conclude
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha || github.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CHECK: ${{ inputs.check-name }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        set -euo pipefail

        # Both values come from the GitHub context, and both are interpolated
        # into a URL path, so shape is checked before use rather than assumed:
        # anything but `owner/name` and a 40-hex SHA is refused outright. The
        # expansions are quoted too, so nothing reaches a second command
        # either way — this is about not building a nonsense request.
        case "$REPO" in
          */*/*|"") echo "::error::unexpected repository '$REPO'"; exit 1 ;;
          */*) ;;
          *) echo "::error::unexpected repository '$REPO'"; exit 1 ;;
        esac
        for value in "$SHA" "$HEAD_SHA"; do
          [ -z "$value" ] && continue
          case "$value" in
            *[!0-9a-fA-F]*|"") echo "::error::unexpected commit sha '$value'"; exit 1 ;;
          esac
        done

        # The review workflow and this one are triggered by the same event, so
        # they share `github.sha`; the head SHA is polled as a fallback for the
        # case where the check landed on the branch tip instead.
        conclusion_of() {
          for candidate in "$SHA" "$HEAD_SHA"; do
            [ -n "$candidate" ] || continue
            gh api "repos/$REPO/commits/$candidate/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$CHECK\")] | last
                    | if . == null then \"\" else .status + \":\" + (.conclusion // \"\") end" \
              2>/dev/null | grep -v '^$' && return 0
          done
          echo ""
        }

        deadline=$(( SECONDS + TIMEOUT_MINUTES * 60 ))
        state=""
        while :; do
          state="$(conclusion_of || true)"
          case "$state" in
            completed:*) break ;;
          esac
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::'$CHECK' did not conclude within ${TIMEOUT_MINUTES}m (last seen: '${state:-not started}')."
            exit 1
          fi
          sleep 15
        done

        conclusion="${state#completed:}"
        echo "'$CHECK' concluded: $conclusion"
        case "$conclusion" in
          success|neutral|skipped)
            echo "::notice::'$CHECK' passed ($conclusion) — continuing."
            ;;
          *)
            echo "::error::'$CHECK' concluded '$conclusion'; this workflow only runs after a successful review."
            exit 1
            ;;
        esac

    - name: Require a review with no findings
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # Same shape check as the wait step: a PR number is digits, a repo is
        # `owner/name`, and neither is trusted into a URL unchecked.
        case "$PR" in
          *[!0-9]*|"") echo "::error::unexpected pull request number '$PR'"; exit 1 ;;
        esac
        case "$REPO" in
          */*/*|"") echo "::error::unexpected repository '$REPO'"; exit 1 ;;
          */*) ;;
          *) echo "::error::unexpected repository '$REPO'"; exit 1 ;;
        esac

        # The reviewer edits ONE sticky comment per PR, so the last comment
        # it authored is this run's report. Its shape (observed across the
        # rounds on PR #82):
        #   **Verdict:** ⚠️ Changes requested   🟠 2 high 🟡 36 medium 🔵 40 low
        #   ### Findings (78)
        # An approved run carries no severity counts.
        body="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
          --jq '[.[] | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")]
                | last | .body // ""')"

        if [ -z "$body" ]; then
          echo "::error::No review comment found on PR #$PR; cannot prove the review is clean."
          exit 1
        fi

        # A review that did not finish is not a clean review, whatever it
        # counted. `### Findings (0)` is emitted by a provider-error run too
        # — one such run on this PR reported zero findings over a file it
        # never fetched — so the verdict is checked BEFORE the count.
        verdict_line="$(printf '%s\n' "$body" | grep -m1 '^\*\*Verdict:\*\*' || true)"
        case "$verdict_line" in
          *incomplete*|*"provider error"*)
            echo "::error::the review did not complete (${verdict_line:-no verdict line}); \
        a zero-finding count from an unfinished review is not a clean review."
            exit 1
            ;;
        esac

        # `### Findings (N)` is the authoritative count when present.
        findings="$(printf '%s\n' "$body" | sed -n 's/^### Findings (\([0-9][0-9]*\)).*/\1/p' | head -1)"

        # Otherwise sum the severity counts on the verdict line.
        if [ -z "$findings" ]; then
          findings="$(printf '%s\n' "$verdict_line" \
            | grep -o '[0-9][0-9]* \(high\|medium\|low\|nit\)' \
            | awk '{ total += $1 } END { print total + 0 }')"
          # A verdict that names no severities and reads as approved is zero.
          if [ "$findings" = "0" ] && ! printf '%s' "$verdict_line" | grep -qi 'approv'; then
            echo "::error::Could not read a finding count from the review comment; refusing to assume it is clean."
            echo "Verdict line was: ${verdict_line:-<none>}"
            exit 1
          fi
        fi

        echo "Review reported $findings finding(s)."
        if [ "$findings" -ne 0 ]; then
          echo "::error::The review reported $findings finding(s); this workflow runs only on a clean review."
          exit 1
        fi
        echo "::notice::Review is green with no findings — continuing."
