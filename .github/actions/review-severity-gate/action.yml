name: Review severity gate
description: >-
  Fail the job when this pull request's Code Review comment reports a `high`
  or `critical` finding. Runs as a step of the review workflow itself, so the
  comment it reads is the one the preceding step has just posted — there is
  no second workflow to poll and no verdict that can go stale behind a rerun.
  Mark the `review` check Required in branch protection to make the red block
  a merge.

inputs:
  github-token:
    description: >-
      Token used to read the reviewer's comment. Needs `pull-requests: read`.
    required: true

runs:
  using: composite
  steps:
    - name: Require a review with no high-severity findings
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # Same shape check as the wait step: a PR number is digits, a repo is
        # `owner/name`, and neither is trusted into a URL unchecked.
        case "$PR" in
          *[!0-9]*|"") echo "::error::unexpected pull request number '$PR'"; exit 1 ;;
        esac
        case "$REPO" in
          */*/*|"") echo "::error::unexpected repository '$REPO'"; exit 1 ;;
          */*) ;;
          *) echo "::error::unexpected repository '$REPO'"; exit 1 ;;
        esac

        # The reviewer edits ONE sticky comment per PR, so the last comment
        # it authored is this run's report. Its shape (observed across the
        # rounds on PR #82):
        #   **Verdict:** ⚠️ Changes requested   🟠 2 high 🟡 36 medium 🔵 40 low
        #   ### Findings (78)
        # An approved run carries no severity counts.
        body="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
          --jq '[.[] | select(.user.login == "github-actions[bot]" or .user.login == "claude[bot]")]
                | last | .body // ""')"

        if [ -z "$body" ]; then
          echo "::error::No review comment found on PR #$PR; cannot prove the review is clean."
          exit 1
        fi

        # A review that did not finish is not a clean review, whatever it
        # counted. `### Findings (0)` is emitted by a provider-error run too
        # — one such run on this PR reported zero findings over a file it
        # never fetched — so the verdict is checked BEFORE the count.
        verdict_line="$(printf '%s\n' "$body" | grep -m1 '^\*\*Verdict:\*\*' || true)"
        case "$verdict_line" in
          *incomplete*|*"provider error"*)
            echo "::error::the review did not complete (${verdict_line:-no verdict line}); \
        a zero-finding count from an unfinished review is not a clean review."
            exit 1
            ;;
        esac

        # Severity, not volume, decides. The review is advisory by construction
        # — code-review.yml pins `FAIL_ON: none` — and an LLM asked for an
        # opinion on a whole diff reliably returns a fresh crop of stylistic
        # findings every pass: PR #82 cleared 230 across four rounds without one
        # confirmed defect in shipped behavior. A gate on "zero findings" is
        # therefore a gate on model noise, and while this gate lived in a
        # separate polling job that `test` and every build job hung off, one
        # medium nit could empty a release.
        #
        # It also could not be satisfied on a release PR at all. release-plz
        # regenerates CHANGELOG.md from the same commit subjects on the next
        # push to `main` and opens a REPLACEMENT PR (the closed #77/#79 and
        # #51/#53 pairs), so a hand-fix to the branch does not survive. Those
        # findings are fixed at the source instead, in release-plz.toml.
        #
        # `high` and `critical` still block. Those are the severities the
        # reviewer reserves for a defect, and they are worth a human's
        # attention before anything ships.
        counts="$(printf '%s\n' "$verdict_line" \
          | grep -o '[0-9][0-9]* \(critical\|high\|medium\|low\|nit\)' || true)"
        # One awk over the pairs rather than grep-then-awk. A `grep` that
        # matches nothing exits 1, which under `pipefail` fails the whole
        # substitution and aborts the step — on the *common* path, where there
        # are no high findings to match. awk selects instead, always runs its
        # END block, and always prints an integer, so `$blocking` needs no
        # emptiness fallback before the `-ne` below.
        blocking="$(printf '%s\n' "$counts" \
          | awk '$2 == "critical" || $2 == "high" { total += $1 } END { print total + 0 }')"

        # `### Findings (N)` is the authoritative total when present; it is
        # reported, never gated on.
        total="$(printf '%s\n' "$body" | sed -n 's/^### Findings (\([0-9][0-9]*\)).*/\1/p' | head -1)"

        # A report that names findings but no severities cannot be classified,
        # and an unclassified finding is not provably below the bar. The one
        # exception is an explicitly approved verdict, which carries no counts
        # because there is nothing to count.
        if [ -z "$counts" ] && [ "${total:-0}" != "0" ] \
           && ! printf '%s' "$verdict_line" | grep -qi 'approv'; then
          echo "::error::Review reported ${total:-an unknown number of} finding(s) but no severity breakdown; refusing to assume none of them are high."
          echo "Verdict line was: ${verdict_line:-<none>}"
          exit 1
        fi

        echo "Review reported ${total:-0} finding(s), $blocking of them high or critical."
        if [ "$blocking" -ne 0 ]; then
          echo "::error::The review reported $blocking high-or-critical finding(s); this workflow runs only once those are resolved."
          exit 1
        fi
        echo "::notice::No high-or-critical findings — continuing."
