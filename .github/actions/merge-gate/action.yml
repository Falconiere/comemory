name: Merge gate
description: >-
  Fail the `merge-gate` check until this pull request is ready to auto-merge:
  it carries the `merge-approved` label, and every review thread has a reply
  from someone other than the account that opened it. Green CI and resolved
  threads are enforced by branch protection itself (required checks and
  required conversation resolution), so this gate checks only what GitHub
  cannot express natively.

inputs:
  github-token:
    description: >-
      Token used to read the pull request's labels and review threads. Needs
      `pull-requests: read`.
    required: true

runs:
  using: composite
  steps:
    - name: Require the merge-approved label and a reply on every thread
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        # Same shape check as review-severity-gate: a PR number is digits, a
        # repo is `owner/name`, and neither is trusted into a query unchecked.
        case "$PR" in
          *[!0-9]*|"") echo "::error::unexpected pull request number '$PR'"; exit 1 ;;
        esac
        case "$REPO" in
          */*/*|"") echo "::error::unexpected repository '$REPO'"; exit 1 ;;
          */*) ;;
          *) echo "::error::unexpected repository '$REPO'"; exit 1 ;;
        esac

        problems=()

        # Read the labels fresh rather than from the event payload: the
        # Code Review bot swaps `request-changes` for `merge-approved` during
        # the review job, after the payload of the event that started it.
        labels="$(gh api "repos/$REPO/issues/$PR/labels?per_page=100" --jq '.[].name')"
        if ! printf '%s\n' "$labels" | grep -qx 'merge-approved'; then
          problems+=("label \`merge-approved\` is missing; the Code Review bot adds it when its verdict is approved")
        fi

        # One JSON object per review thread, across every page.
        threads="$(gh api graphql --paginate \
          -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
          -f query='
            query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      isResolved
                      path
                      comments(first: 100) { nodes { url author { login } } }
                    }
                  }
                }
              }
            }' \
          --jq '.data.repository.pullRequest.reviewThreads.nodes[]')"

        # A thread is answered once a later comment comes from an author other
        # than its opener. The reviewer posts its own follow-ups inside its
        # threads (PR #289 had five `github-actions > github-actions >
        # Falconiere` threads), so "has a second comment" would count the bot
        # answering itself. A code-scanning alert thread
        # (`github-advanced-security`) is exempt once resolved: its
        # resolution is the finding being fixed or dismissed.
        unanswered="$(printf '%s\n' "$threads" | jq -rs '
          .[]
          | (.comments.nodes[0].author.login // "ghost") as $opener
          | select(($opener == "github-advanced-security" and .isResolved) | not)
          | select([.comments.nodes[1:][] | .author.login // "ghost"]
                   | any(. != $opener) | not)
          | "\(.path): \(.comments.nodes[0].url)"')"
        while IFS= read -r thread; do
          [ -n "$thread" ] && problems+=("review thread has no reply: $thread")
        done <<<"$unanswered"

        if [ "${#problems[@]}" -eq 0 ]; then
          echo "PR #$PR is ready to auto-merge: labeled \`merge-approved\` and every review thread answered." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        {
          echo "### Merge gate: PR #$PR is not ready"
          for p in "${problems[@]}"; do echo "- $p"; done
        } >>"$GITHUB_STEP_SUMMARY"
        for p in "${problems[@]}"; do echo "::error::$p"; done
        exit 1
