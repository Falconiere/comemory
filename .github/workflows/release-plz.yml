# release-plz: Release-PR automation that fronts the cargo-dist pipeline.
#
# Two jobs, both on push to `main`:
#   release-plz-pr      — opens/maintains the "release PR" (version bump +
#                         CHANGELOG).
#   release-plz-release — on the merged version-bump commit, pushes the vX.Y.Z
#                         tag (which is what fires release.yml).
#
# Both jobs authenticate with a short-lived GitHub App installation token minted
# for the `toolu-release` App — the same publish App the release.yml tap step
# uses — from its Client ID and secrets.HOMEBREW_APP_PRIVATE_KEY. (The HOMEBREW_
# prefix is a misnomer here: it is one App wearing two hats. The name is what
# Infisical syncs, so it stays.) An App token is REQUIRED on the release job:
# a tag pushed with the default GITHUB_TOKEN does NOT trigger downstream
# workflows, so release.yml would never fire. Using it on the release-pr job too
# means the release PR also triggers CI checks. Unlike a PAT it is not tied to a
# person's account and cannot silently expire.
#
# The Client ID (`Iv23cthPzC6Oci4iBLZV`) is written into each mint step as a
# literal. It is a public identifier, not a credential — anyone can read it from
# GET /apps/toolu-release — so it needs no secret, and the private key stays the
# only credential. It replaces the deprecated `app-id` input, which took the
# numeric App ID from secrets.HOMEBREW_APP_ID; that secret is no longer read.
#
# The App must therefore be installed on Falconiere/comemory ITSELF with
# Contents: read+write and Pull requests: read+write — not only on
# Falconiere/homebrew-tap, which is all the tap step needs.
#
# toolu-release is a shared App (owned by CodaSignal) whose grant is far wider
# than this workflow needs: actions, workflows, packages, issues and more, plus
# org administration and org secrets where it is installed on an organisation.
# So every mint step narrows its token with `permission-*` inputs to exactly
# what that job does, and the token release-plz (and every build script
# cargo-semver-checks compiles) can see carries no more. Unlike the tap step,
# these mint steps pass no owner/repositories inputs: the action then defaults
# to the current repository, so each token is scoped to comemory alone.
#
# The private key, though, is App-wide: anything that can read
# HOMEBREW_APP_PRIVATE_KEY can mint a token for ANY toolu-release installation.
# Treat it as a credential for the whole App, not a tap-only one.
#
# The jobs themselves run on a read-only GITHUB_TOKEN. Checkout only fetches
# (persist-credentials: false) and release-plz writes with the App token alone,
# so the default token needs no write scope.
#
# release-plz/action is pinned to v0.5.139, which installs release-plz 0.3.169:
# the last version that produced this repo's release PRs (v0.55.0–v0.57.0).
# v0.5.145+ moved to release-plz 0.4.x, whose 0.4.0 reworked the changelog
# config conversion, untested against the custom commit_parsers / pr_body /
# body templates in release-plz.toml. Bump deliberately, after a local
# `release-plz update` under the new version renders the same changelog.
#
# Both jobs are gated behind the `RELEASE_PLZ_ENABLED` repo variable so merging
# this file does not immediately start cutting releases. Flip it on (Actions →
# Variables → RELEASE_PLZ_ENABLED=true) only AFTER the App is installed here.
# See docs/release.md § one-time setup.
#
# config: release-plz.toml (git_release_enable=false, publish=false — cargo-dist
# owns build + GitHub Release; release-plz owns version + CHANGELOG + tag).

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Open / maintain the release PR.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ vars.RELEASE_PLZ_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23cthPzC6Oci4iBLZV # toolu-release
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          # Push the release branch, open/update/close release PRs.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95"
      - name: Run release-plz (release-pr)
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # On the merged version bump, push the vX.Y.Z tag (which fires release.yml).
  # The App token is mandatory here — see the header note.
  release-plz-release:
    name: Release-plz release
    if: ${{ vars.RELEASE_PLZ_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23cthPzC6Oci4iBLZV # toolu-release
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          # Push the vX.Y.Z tag; read the merged release PR.
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95"
      - name: Run release-plz (release)
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
