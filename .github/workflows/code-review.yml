name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # upload the gitleaks/opengrep SARIF to the Code Scanning tab

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v4 replaced the PROVIDERS JSON array with the flat
      # PROVIDER / MODEL_ID / API_KEY contract. v5 made FAIL_ON default to
      # "changes"; this job pins FAIL_ON: none instead, so the review is
      # advisory — see the FAIL_ON comment below. v7 changed MAX_CHUNKS
      # to default 0 (unlimited) from 20 — a large PR is now reviewed whole
      # rather than truncated, at unbounded model-call cost; pin
      # MAX_CHUNKS: 20 to restore the old cap. v7 also dropped file-level
      # fallback comments (unanchorable findings now land in the sticky
      # comment only) and changed that comment's layout.
      - uses: falconiere/toolu-ghactions/code-review@v7
        with:
          # OpenRouter rather than a vendor's native API: one key and one
          # billing account cover every model, so swapping the reviewer is a
          # MODEL_ID edit and not a new secret to provision. `deepseek-v4-pro`
          # is the action's own OpenRouter default, pinned explicitly here so
          # an upstream default change cannot silently swap the reviewer.
          PROVIDER: openrouter
          MODEL_ID: deepseek/deepseek-v4-pro
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Advisory, not gating: the review still runs, still posts its
          # findings, and still uploads SARIF — it just does not fail the
          # job on a "changes requested" verdict. The verdict is a model's
          # opinion on the whole diff, so on a large PR it reliably emits
          # a fresh crop of stylistic findings each run; PR #82 cleared
          # 230 of them across four rounds without one confirmed defect in
          # shipped behavior. The gates that must stay red on a real
          # problem are `test` (scripts/check-all.sh + the nextest suite)
          # and `plan`.
          #
          # `FAIL_ON` is verdict-driven — `changes` would fail on any
          # request-changes verdict, which is precisely the noise above. The
          # severity gate that follows this step fails the job instead, on
          # `high` and `critical` only: the severities the reviewer reserves
          # for a defect. `medium`/`low`/`nit` stay informational.
          FAIL_ON: none
          # CLAUDE.md is already covered by the action's default Tier-1 convention
          # files; guardrails.config.json (the toolu-conventions structure gate
          # config) is not, so it is added explicitly. RULES_REF stays "base"
          # (the action's default) so a PR cannot rewrite the rules it is judged
          # by.
          RULES_GLOB: guardrails.config.json
          RULES_REF: base
          # `.claude/` is agent scratch, never shipped code, and this PR
          # DELETES `.claude/tmp/.gitkeep` — the reviewer cannot fetch
          # content that is not there, so it reported the file
          # `unreviewed (not-attempted)` and downgraded its own verdict to
          # "Review incomplete — provider error" on a diff it had no
          # findings against. Excluded files are still committed and still
          # gated by `test`; they are only kept out of the LLM's diff.
          EXCLUDE_GLOBS: .claude/**

      # The gate is a STEP of this job, not a job in another workflow. That is
      # the whole design: `review` goes red on a high-or-critical finding, and
      # branch protection blocks the merge on the red. Nothing `needs:` this,
      # so nothing can be skipped by it — the cascade that shipped v0.18.0 and
      # v0.18.1 with no binaries is not expressible any more. A rerun of this
      # workflow re-evaluates its own check, so a verdict cannot go stale.
      - uses: ./.github/actions/review-severity-gate
        with:
          github-token: ${{ github.token }}
