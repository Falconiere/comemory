name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read
  pull-requests: read

# One live run per ref. Pushing three times in a row used to leave three
# full suites running against commits already superseded; now only the
# newest survives. `main` is included deliberately — the last push wins
# there too, and nothing downstream reads an intermediate run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-workflow gate: GitHub has no `needs:` across workflows, so this job
  # waits on the Code Review check for the same commit and fails unless it
  # succeeded. Pull requests only — `Code Review` does not run on a push to
  # `main`, and waiting for a check that will never appear would burn the
  # whole timeout before failing a push that nothing was wrong with.
  #
  # The gate is on the STEPS, never on the job. A skipped job propagates
  # "skipped" transitively down the whole `needs` graph, and an `always()`
  # rescues only the job that carries it — never its descendants. `test` is
  # a leaf today and rescued itself, so a job-level `if` here was
  # survivable; the identical shape in release.yml was not, and shipped
  # v0.18.0 and v0.18.1 as releases with no binaries (see the comment on
  # that file's `await-review` for the measured job-by-job split). Running
  # this job unconditionally and no-op'ing its steps keeps its result
  # `success`, so nothing downstream can ever be skipped by it.
  await-review:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/await-code-review
      - uses: ./.github/actions/await-code-review
        if: ${{ github.event_name == 'pull_request' }}
        with:
          github-token: ${{ github.token }}

  test:
    # No `if:` — `await-review` always runs, so it is `success` on a push to
    # `main` and a failed review still skips this job.
    needs: [await-review]
    runs-on: ubuntu-22.04
    env:
      COMEMORY_INDEXING_AUTO_REINDEX: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo tools
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-nextest,cargo-llvm-cov,typos-cli@1.32.0
      - name: Install ast-grep
        # ast-grep is not in taiki-e/install-action's supported-tools manifest
        # (TOOLS.md), so it is installed directly. scripts/guardrails-check.sh
        # (part of scripts/check-all.sh) exits 3 without it on PATH.
        run: cargo install ast-grep --locked
      - name: Run check-all gate
        run: bash scripts/check-all.sh
      - name: Run coverage gate
        run: bash scripts/coverage-check.sh
      - name: Run eval gate
        run: bash scripts/eval-check.sh
