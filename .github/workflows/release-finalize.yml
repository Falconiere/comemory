# Hand-maintained release finalize workflow — picks up after the
# dist-generated .github/workflows/release.yml finishes a tag build, runs a
# smoke test against the published tarball, and fails the workflow run if
# the artifact is malformed. The release itself is already created by
# the dist-generated `host` job in release.yml.
#
# This file is intentionally NOT generated by `cargo dist init`. Anything
# added to the dist-generated release.yml will be clobbered on the next
# dist regeneration; the additions here live in a separate file.
#
# Trigger: the completion of the dist-generated `Release` workflow — NOT
# `on: release`.
#
# This file sat on `on: release: [published, prereleased]` from the day it was
# added and never ran once: 0 runs against 202 for release.yml. release.yml's
# `host` job creates the release with `secrets.GITHUB_TOKEN`, and GitHub does
# not dispatch workflows from events a GITHUB_TOKEN created — the documented
# recursion guard. So the release event fired into the void, and both the
# curated-notes step and the signing step below have never executed. That is
# why every release body is still cargo-dist's auto-generated one.
#
# `workflow_run` is not subject to that guard: it keys off the workflow
# finishing rather than the release being published. The tag comes from the
# triggering run's `head_branch`, which for a tag push IS the tag name.
#
# workflow_dispatch is here so this can be exercised against an existing tag
# without cutting a release — worth having for a workflow with no run history.
#
# Concurrency: per-tag so a fast re-tag doesn't collide with the previous
# run for the same tag.

name: Release Finalize

on:
  # Called by the dist-generated release.yml as a post-announce job (declared
  # in Cargo.toml's [workspace.metadata.dist] post-announce-jobs), so it runs
  # once the release exists with every artifact on it.
  #
  # NOT `on: release`. This file sat on that trigger from the day it was added
  # and never ran once — 0 runs against 202 for release.yml — because
  # release.yml's `host` job creates the release with `secrets.GITHUB_TOKEN`,
  # and GitHub does not dispatch workflows from events a GITHUB_TOKEN raises.
  # The event fired into the void, so neither the curated-notes step nor the
  # signing step below has ever executed. That is why every release body up to
  # v0.16.0 is cargo-dist's auto-generated one.
  workflow_call:
    inputs:
      plan:
        description: The dist plan, as JSON. Passed by release.yml; unused here.
        required: false
        type: string
  # Lets this be exercised against an existing tag without cutting a release —
  # worth having for a workflow with no run history.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to finalize (e.g. v0.16.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-finalize-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: verify release artifacts
    runs-on: ubuntu-22.04
    # `gh release edit` (curated notes) and `gh release upload` (the signature)
    # both write to the release. The workflow-level default is `contents: read`
    # (line 22), so this is a deliberate elevation for this job only, not a
    # redundant restatement of an already-write baseline.
    # The notes step is not guarded by continue-on-error, so this job fails on
    # that 403 rather than skipping quietly — see keys/README.md for the rest of
    # what stands between here and a signed release.
    permissions:
      contents: write
    steps:
      - name: Resolve the tag
        id: tag
        env:
          # Under workflow_call the github context is the CALLER's, so ref_name
          # is the tag release.yml was triggered by. A dispatch supplies its own.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          # release.yml also runs on non-tag refs in some dist configurations;
          # finalizing one of those would edit a release that does not exist.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::not a version tag ($tag) — nothing to finalize"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          # The tag's own tree, not the default branch — `curate-release-notes.sh`
          # reads the CHANGELOG as it was at the release. Full history + tags so
          # the previous tag can be derived (the release event used to supply it).
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Download the release archive
        if: steps.tag.outputs.skip != 'true'
        # `actions/download-artifact` cannot see another workflow run's
        # artifacts, and on this trigger the run owns none — it would fail
        # before any step below. The archive is already on the release by the
        # time release.yml has finished, so take it from there.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'comemory-aarch64-apple-darwin.tar.xz' --dir artifacts

      - name: Locate macOS tarball
        id: locate
        if: steps.tag.outputs.skip != 'true'
        run: |
          # Single target from Cargo.toml: aarch64-apple-darwin.
          # On a Linux runner, the tarball is here but the binary is macOS-only.
          # We only verify its contents (manifest + tar layout + size sanity) —
          # we can't execute it on Linux. The dist-generated release.yml already
          # proved it builds + links.
          tarball="$(ls artifacts/comemory-aarch64-apple-darwin.tar.xz 2>/dev/null \
            | head -1 || true)"
          if [[ -z "$tarball" ]]; then
            echo "::error::no comemory-aarch64-apple-darwin.tar.xz artifact found"
            ls -la artifacts/ || true
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify tarball layout + size
        if: steps.tag.outputs.skip != 'true'
        env:
          # Same defense-in-depth as the curate step above: route the step
          # output through env: rather than inlining ${{ ... }} into the
          # shell command line.
          TARBALL: ${{ steps.locate.outputs.tarball }}
        run: |
          # Confirm the tarball is a valid archive with the expected binary
          # path and a sane size (> 1 MB — the binary alone is ~10 MB).
          size="$(stat -c%s "$TARBALL" 2>/dev/null \
            || stat -f%z "$TARBALL")"
          if (( size < 1048576 )); then
            echo "::error::tarball is suspiciously small: ${size} bytes"
            exit 1
          fi
          tar -tJf "$TARBALL" \
            | grep -q '^comemory-aarch64-apple-darwin/comemory$' \
            || { echo "::error::expected binary not in tarball"; exit 1; }
          echo "::notice::tarball layout OK (${size} bytes)"

      - name: Curate release notes from CHANGELOG.md
        id: notes
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # Route all interpolated GitHub contexts through env: rather than
          # inlining ${{ ... }} into the shell command. Tag names are
          # user-controllable, and Actions expands ${{ ... }} before bash
          # parses the line — so an inlined tag like `$(rm -rf /)` would
          # execute in the runner. Variable expansion inside a quoted string
          # is safe; command substitution is not.
          REPO: ${{ github.repository }}
        run: |
          ver="${TAG#v}"
          # The release event supplied `previous_tag_name`; workflow_run does
          # not, so derive it. Empty on the very first tag — a compare link with
          # no left side 404s, so fall back to the tag's own page there.
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          bash scripts/curate-release-notes.sh "$ver" > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::warning::curate-release-notes.sh produced empty output; falling back to default"
            if [[ -n "$prev_tag" ]]; then
              echo "See the commit log at https://github.com/${REPO}/compare/${prev_tag}...${TAG}" > "$RUNNER_TEMP/notes.md"
            else
              echo "See https://github.com/${REPO}/releases/tag/${TAG}" > "$RUNNER_TEMP/notes.md"
            fi
          fi
          echo "notes-bytes=$(wc -c < "$RUNNER_TEMP/notes.md" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Edit release with curated notes
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Sign sha256.sum (optional, opt-in)
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSPHRASE: ${{ secrets.MINISIGN_PASSPHRASE }}
        continue-on-error: true
        run: |
          # The MINISIGN_KEY + MINISIGN_PASSPHRASE secrets are optional. If
          # they're not set, the sign-release.sh script prints a warning and
          # exits 0 — the release is still published, just without a signature.
          bash scripts/sign-release.sh "$TAG"

      - name: Cleanup
        if: always()
        run: |
          rm -rf artifacts/
